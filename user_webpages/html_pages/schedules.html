<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schedules | Scheduler</title>
  <link rel="icon" href="/user_webpages/images/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <script>
    /* Apply the saved theme before the page paints (avoids a flash) */
    try {
      var c = JSON.parse(localStorage.getItem("scheduler-theme-cache") || "null");
      if (c) { var r = document.documentElement; r.dataset.theme = c.theme; r.dataset.cb = c.cb; r.dataset.contrast = c.contrast; r.style.setProperty("--font-scale", c.scale / 100); }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/user_webpages/css/app.css">
  <link rel="stylesheet" href="/user_webpages/css/schedules.css">
</head>
<body data-page="schedules">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app" id="app">
    <header id="topbar"></header>
    <aside id="sidebar"></aside>
    <div class="scrim" aria-hidden="true"></div>
    <main class="main" id="main" tabindex="-1">
      <div class="page-head">
        <div>
          <h1>Schedules</h1>
          <p>Click a schedule to see its tasks, mark them done, download it or move it to the trash.</p>
        </div>
        <div class="page-head__actions">
          <div class="seg" role="group" aria-label="View">
            <button type="button" data-view="calendar" aria-pressed="true">Calendar</button>
            <button type="button" data-view="list" aria-pressed="false">List</button>
          </div>
          <button type="button" class="btn btn--yellow" data-create="schedule">New schedule</button>
        </div>
      </div>

      <section class="pinned" id="pinned" aria-labelledby="pinned-title" hidden>
        <h2 id="pinned-title">Pinned</h2>
        <div class="pinned__row" id="pinned-list"></div>
      </section>

      <section class="card month" id="calendar-view" aria-labelledby="month-title">
        <div class="month__head">
          <button type="button" class="icon-btn" data-month="-1" aria-label="Previous month">&lsaquo;</button>
          <h2 id="month-title" aria-live="polite"></h2>
          <button type="button" class="icon-btn" data-month="1" aria-label="Next month">&rsaquo;</button>
          <button type="button" class="btn btn--sm btn--ghost" id="month-today">Today</button>
        </div>
        <div class="month__grid" id="month-grid" role="grid"></div>
      </section>

      <section id="list-view" hidden aria-label="All schedules">
        <div class="list-tools">
          <label class="visually-hidden" for="list-filter">Filter schedules</label>
          <input class="input" id="list-filter" type="search" placeholder="Filter by label or description">
          <label class="visually-hidden" for="list-range">Show</label>
          <select class="select" id="list-range">
            <option value="upcoming">Upcoming</option>
            <option value="past">Past</option>
            <option value="all">All</option>
          </select>
        </div>
        <div id="list-groups"></div>
      </section>
    </main>
  </div>
  <div class="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="/user_webpages/javascript/store.js"></script>
  <script src="/user_webpages/javascript/app.js"></script>
  <script src="/user_webpages/javascript/schedules.js"></script>
</body>
</html>
